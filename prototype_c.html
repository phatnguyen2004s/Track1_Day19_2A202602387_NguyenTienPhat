<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VLearn · Guided Check</title><style>
:root{--b:#075ba8;--ink:#192333;--muted:#687487;--line:#dbe2e9;--g:#28745e;--o:#c65336}*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 24px;gap:18px}.brand{font-weight:800;color:var(--b);font-size:21px}.crumb{font-size:14px;color:var(--muted)}.right{margin-left:auto;display:flex;gap:12px;align-items:center}.reset,.btn{border-radius:8px;padding:9px 14px;font-weight:750;cursor:pointer}.reset,.btn.secondary{background:#fff;border:1px solid #bac6d3;color:#33445a}.app{height:calc(100vh - 62px);min-height:680px;display:flex;flex-direction:column}.coursebar{height:48px;background:#f7f9fb;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 27px;color:#566477;font-size:13px}.progress{margin-left:auto}.workspace{width:min(1240px,94vw);margin:20px auto;flex:1;display:flex;min-height:0}.shell{background:#fff;border:1px solid #d4dce5;border-radius:12px;box-shadow:0 12px 35px #182a431c;flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}.intro{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px}.intro h1{font-size:42px;letter-spacing:-.04em;margin:0 0 12px}.intro p{font-size:18px;color:var(--muted);max-width:620px;margin:0 0 30px}.start{font-size:19px;padding:17px 38px;border-radius:10px}.slide{padding:42px 58px 30px;flex:1;overflow:auto}.slide h1{font-size:33px;line-height:1.15;margin:0 0 42px;letter-spacing:-.03em}.problem{color:var(--o)}.solution{color:var(--g)}.sub{font-size:21px;color:#6f7885;margin:-29px 0 34px}.diamond{width:100%;max-width:990px;height:260px;display:block;margin:auto}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:25px;margin:12px 12px 0}.phase{font-size:14px}.phase b{display:block;letter-spacing:.07em;color:#5e6875;font-size:13px}.phase ul{padding-left:17px;margin:7px 0;color:#707b88}.note{margin:28px auto 0;max-width:950px;border:1px solid #e9d49f;background:#fff9ea;padding:13px 15px;border-radius:8px;color:#6f5724;font-size:14px}.bottom{height:66px;background:#fbfcfd;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 22px;gap:10px}.hint{font-size:13px;color:var(--muted)}.primary{border:0;background:var(--b);color:#fff}.next{margin-left:auto}.timer{color:#335b80;font-size:13px}.pulse{width:8px;height:8px;border-radius:50%;background:var(--b);box-shadow:0 0 0 4px #075ba81f}.overlay{position:absolute;inset:0;background:#101d2d5c;display:flex;align-items:center;justify-content:center;padding:25px;z-index:5}.dialog{width:min(540px,92%);background:#fff;border-radius:13px;box-shadow:0 25px 70px #0f203755;border:1px solid #bcd0e2;overflow:hidden}.aihead{padding:15px 18px;border-bottom:1px solid var(--line);font-weight:800}.spark{color:var(--b);font-size:20px}.aibody{padding:18px}.aibody h2{font-size:20px;margin:0 0 7px}.aibody p{color:#536175;margin:0 0 14px}.signal{padding:10px 11px;border:1px solid #bfd9f1;background:#eaf4ff;border-radius:8px;color:#3e6384;font-size:13px;margin-bottom:14px}.choices{display:grid;gap:9px}.choice{background:#fff;border:1px solid #c5d0dc;border-radius:8px;padding:11px 13px;text-align:left;cursor:pointer;color:#263b52;font-weight:650}.choice:hover{background:#eaf4ff;border-color:var(--b)}.micro{font-size:12px!important;color:#7b8794!important;margin-top:14px!important}.result{padding:30px 38px;flex:1;overflow:auto}.result h2{margin:0 0 3px;font-size:25px}.resultsub{color:var(--muted);font-size:13px;margin-bottom:18px}.block{border-left:3px solid #b8d1e9;padding-left:13px;margin:16px 0}.block h3{font-size:15px;color:#254765;margin:0 0 5px}.block p,.block li{font-size:14px;color:#46566a}.block ul{padding-left:18px}.take{padding:14px;background:#e8f6f1;border:1px solid #b7dfd2;border-radius:8px;color:#265e50;font-size:14px}.limit{padding:10px;background:#f5f7fa;border-radius:8px;color:#6c7888;font-size:12px;margin-top:15px}@media(max-width:800px){.intro h1{font-size:31px}.slide{padding:26px 22px}.slide h1{font-size:25px}.row{gap:9px}.phase{font-size:12px}.crumb{display:none}}
</style></head><body><header class="top"><div class="brand">VLearn</div><div class="crumb">Ngày 3 · Day 18 · Design the Experiment</div><div class="right"><span style="font-size:13px;color:#667386">Option B3 · Guided Check</span><button class="reset" id="reset">Đặt lại</button></div></header><main class="app"><div class="coursebar"><b>Design the experiment</b><span style="margin-left:10px">· Human-Centered AI Design</span><span class="progress" id="progress">Slide 5 / 23</span></div><div class="workspace"><section class="shell" id="shell"></section></div></main><script>
let slide=0,ai=false,paused=false,deadline=Date.now()+8000;
function diagram(){return `<svg class="diamond" viewBox="0 0 930 250"><text x="165" y="17" text-anchor="middle" font-size="12" fill="#8b8278">Divergence</text><text x="330" y="17" text-anchor="middle" font-size="12" fill="#8b8278">Convergence</text><text x="585" y="17" text-anchor="middle" font-size="12" fill="#28745e">Divergence</text><text x="770" y="17" text-anchor="middle" font-size="12" fill="#28745e">Convergence</text><polygon points="35,125 235,38 435,125 235,212" fill="#faf8f4" stroke="#e1dbd3" stroke-width="2"/><polygon points="435,125 635,38 835,125 635,212" fill="#e8f6f1" stroke="#28745e" stroke-width="2"/><circle cx="435" cy="125" r="8" fill="#c65336"/><text x="435" y="152" text-anchor="middle" font-size="11" fill="#c65336">Chosen opportunity</text><text x="235" y="120" text-anchor="middle" font-size="14" fill="#777">Finding the</text><text x="235" y="140" text-anchor="middle" font-size="19" fill="#777" font-weight="800">PROBLEM</text><text x="635" y="120" text-anchor="middle" font-size="14" fill="#28745e">Finding the</text><text x="635" y="140" text-anchor="middle" font-size="19" fill="#28745e" font-weight="800">SOLUTION</text></svg>`}
function original(n){if(n===0)return `<div class="slide"><h1>Evidence về <span class="problem">problem</span> không phải evidence về <span class="solution">solution</span></h1>${diagram()}<div class="row"><div class="phase"><b>DISCOVER</b><ul><li>Problem interview</li><li>Past story</li><li>Behavior & workaround</li></ul></div><div class="phase"><b>DEFINE</b><ul><li>Synthesis note</li><li>Pain pattern</li><li>Chọn opportunity</li></ul></div><div class="phase"><b>DEVELOP</b><ul><li>Diverge cơ chế</li><li>Standard / ++ / Wild</li><li>Micro-prototype</li></ul></div><div class="phase"><b>DELIVER</b><ul><li>Prototype interview</li><li>Quan sát behavior</li><li>Next iteration</li></ul></div></div><div class="note"><b>Điểm cần hiểu:</b> evidence về problem chứng minh người dùng đang gặp khó khăn; evidence về solution phải chứng minh một cách giải cụ thể thực sự hữu ích.</div></div>`;if(n===1)return `<div class="slide"><h1>Ta đã hiểu <span class="problem">pain</span>. Bây giờ đến lượt <span class="solution">solution</span></h1><div style="height:300px"></div><div style="display:flex;justify-content:space-between;align-items:center;max-width:920px;margin:auto"><div><small style="color:#7b8088">DAY 17</small><h2>Problem evidence</h2><p style="color:#606b79">Tìm evidence về người dùng, tình huống và pain.</p><span class="choice" style="display:inline-block;padding:7px 13px">story</span> <span class="choice" style="display:inline-block;padding:7px 13px">behavior</span> <span class="choice" style="display:inline-block;padding:7px 13px">workaround</span></div><div style="font-size:38px;color:#4f5966">→</div><div><small style="color:#28745e">DAY 18</small><h2 style="color:#28745e">Solution evidence?</h2><p style="color:#606b79">Khám phá các cách giải và tìm evidence cho bước tiếp theo.</p><span class="choice" style="display:inline-block;padding:7px 13px">options</span> <span class="choice" style="display:inline-block;padding:7px 13px">experiment</span></div></div></div>`;return `<div class="slide"><h1>Cùng một <span class="problem">pain</span> có thể dẫn tới nhiều cách giải</h1><div class="sub">Cách nào phù hợp hơn — và trong điều kiện nào?</div><div style="border:1px solid #d8dce1;padding:16px;margin:0 0 32px"><b style="color:#8a8d91;letter-spacing:.08em;margin-right:18px">TÌNH HUỐNG</b>Người học vừa trả lời sai lần thứ hai và không biết tiếp tục thế nào.</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:25px;max-width:920px;margin:auto"><div><h2>A <small>User-led</small></h2><div class="choice" style="height:90px;margin-top:10px">Help</div><p><b>TRIGGER</b><br>Người học tự mở Help</p><p><b>USER QUYẾT ĐỊNH</b><br>Chọn loại trợ giúp</p></div><div><h2>B <small>Collaborative</small></h2><div class="choice" style="height:90px;margin-top:10px;background:#eaf4ff">“Bạn đang lẫn hai công thức?”<br><button class="btn secondary" style="padding:5px 16px;margin-top:7px">Đúng</button> <button class="btn secondary" style="padding:5px 16px">Không</button></div><p><b>TRIGGER</b><br>AI hỏi khi thấy dấu hiệu</p><p><b>USER QUYẾT ĐỊNH</b><br>Xác nhận hoặc sửa chẩn đoán</p></div><div><h2>C <small>Proactive</small></h2><div class="choice" style="height:90px;margin-top:10px;background:#fff2df">Sai 2 lần → ôn lại phần này?</div><p><b>TRIGGER</b><br>AI tự phát hiện, tự mở</p><p><b>ĐÁNH ĐỔI</b><br>Dễ gián đoạn, dễ bị nghi ngờ</p></div></div></div>`}
function result(){return `<div class="result"><h2>Double Diamond</h2><div class="resultsub">Giải thích dựa trên slide “Evidence về problem không phải evidence về solution”.</div><div class="block"><h3>Giải thích ngắn</h3><p>Double Diamond giúp nhóm đi từ hiểu đúng vấn đề đến phát triển và kiểm chứng giải pháp. Viên kim cương thứ nhất gồm <b>Discover</b> và <b>Define</b> để tìm đúng vấn đề; viên thứ hai gồm <b>Develop</b> và <b>Deliver</b> để tìm đúng giải pháp.</p><ul><li><b>Divergence:</b> mở rộng để thu thập nhiều thông tin hoặc tạo nhiều phương án.</li><li><b>Convergence:</b> thu hẹp bằng evidence và lựa chọn hướng phù hợp.</li></ul></div><div class="block"><h3>Ví dụ</h3><p>Quan sát học viên chuyển tab khi chưa hiểu bài là <b>problem evidence</b>. Tạo prototype, cho học viên thử và quan sát cách giải có giúp họ tiếp tục hay không mới tạo ra <b>solution evidence</b>.</p></div><div class="take"><b>Ý chính cần nhớ:</b> Có evidence về problem chưa có nghĩa là solution đã được chứng minh. Nhóm phải thử nghiệm giải pháp để thu evidence riêng.</div><div class="limit">AI dựa trên nội dung các slide mẫu; câu trả lời có thể thiếu ngữ cảnh và không thay thế tài liệu hoặc giảng viên.</div></div>`}
function contextual(key){const copy={two:['Vì sao có hai “viên kim cương”?','Viên kim cương thứ nhất giúp nhóm tìm đúng vấn đề: Discover mở rộng việc tìm hiểu, còn Define thu hẹp để chọn problem và opportunity. Viên kim cương thứ hai giúp nhóm tìm đúng giải pháp: Develop mở rộng các cơ chế, còn Deliver thu hẹp bằng prototype và evidence.'],four:['Bốn giai đoạn liên kết thế nào?','Discover thu thập evidence về người dùng và vấn đề. Define tổng hợp evidence để chọn problem. Develop tạo nhiều solution hypotheses. Deliver kiểm thử prototype, quan sát hành vi và chọn hướng tiếp theo.'],thinking:['Divergence và Convergence khác nhau ra sao?','Divergence là mở rộng: nhóm khám phá nhiều vấn đề, góc nhìn hoặc phương án. Convergence là thu hẹp: nhóm phân tích evidence, so sánh và lựa chọn hướng phù hợp nhất.']}[key]||['Giải thích Double Diamond','Double Diamond giúp nhóm tìm đúng vấn đề trước, sau đó phát triển và kiểm chứng giải pháp.'];return `<div class="context-answer"><h3>${copy[0]}</h3><p>${copy[1]}</p><div class="decision"><b>Bạn đã hiểu phần này chưa?</b><div><button class="btn primary" data-decision="understood">Đã hiểu</button><button class="btn secondary" data-decision="not-understood">Chưa hiểu</button></div></div></div>`}
function response(key){return `${result()}<div style="padding:0 38px 24px">${contextual(key)}</div>`}
function popup(){return `<div class="overlay"><div class="dialog"><div class="aihead"><span class="spark">✦</span> VLearn AI · Guided Check</div><div class="aibody"><div class="signal"><b>Vì sao AI hỏi?</b> Bạn đã ở lại slide Double Diamond hơn 15 giây. Đây là tín hiệu gợi ý, không phải kết luận rằng bạn chưa hiểu.</div><h2>Bạn đã hiểu slide này chưa?</h2><p>Chọn phần gần nhất với điều bạn đang cần làm rõ.</p><div class="choices"><button class="choice" data-answer="understood">Tôi đã hiểu, tiếp tục</button><button class="choice" data-answer="two">Chưa hiểu vì sao có hai viên kim cương</button><button class="choice" data-answer="four">Chưa hiểu bốn giai đoạn liên kết thế nào</button><button class="choice" data-answer="thinking">Chưa hiểu Divergence và Convergence</button></div><p class="micro">Bạn có thể đóng thông báo để đọc tiếp; AI chỉ hoạt động trên slide Double Diamond này.</p></div></div></div>`}
function render(){const shell=document.querySelector('#shell');document.querySelector('#progress').textContent=slide<0?'Intro':`Slide ${slide+5} / 23`;if(slide<0){shell.innerHTML=`<div class="intro"><h1>Tìm hiểu về Double Diamond</h1><p>Khám phá cách nhóm đi từ việc tìm đúng vấn đề đến phát triển và kiểm chứng giải pháp.</p><button class="btn primary start" data-start>Bắt đầu</button></div>`}else if(slide===0){shell.innerHTML=`${original(0)}<div class="bottom"><span class="hint">AI theo dõi thời gian ở lại trong hệ thống.</span><button class="btn primary next" data-next>Slide tiếp theo</button></div>${ai?popup():''}`}else{shell.innerHTML=`${original(slide)}<div class="bottom"><button class="btn secondary" data-prev>Slide trước</button><span class="hint">AI không hoạt động trên slide này.</span>${slide<2?'<button class="btn primary next" data-next>Slide tiếp theo</button>':'<button class="btn primary next" data-done>Bạn đã học xong</button>'}</div>`}bind()}
function bind(){document.querySelector('[data-start]')?.addEventListener('click',()=>{slide=0;ai=false;paused=false;deadline=Date.now()+8000;render()});document.querySelector('[data-next]')?.addEventListener('click',()=>{slide=Math.min(2,slide+1);ai=false;paused=false;render()});document.querySelector('[data-prev]')?.addEventListener('click',()=>{slide=Math.max(0,slide-1);ai=false;paused=false;render()});document.querySelector('[data-done]')?.addEventListener('click',()=>{document.querySelector('#shell').innerHTML=`<div class="intro"><h1 style="font-size:34px">Bạn đã học xong</h1><p>Bạn đã đi qua ba slide về Double Diamond và hiểu cách phân biệt problem evidence với solution evidence.</p><button class="btn secondary start" data-reset>Học lại từ đầu</button></div>`;bind()});document.querySelector('[data-reset]')?.addEventListener('click',()=>{slide=-1;ai=false;paused=false;deadline=Date.now()+8000;render()});document.querySelectorAll('[data-answer]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.answer==='understood'){ai=false;paused=false;deadline=Date.now()+8000;render()}else{ai=false;paused=true;document.querySelector('#shell').innerHTML=`${response(b.dataset.answer)}<div class="bottom"><button class="btn secondary" data-reset>Về trang bắt đầu</button><button class="btn primary next" data-next>Slide tiếp theo</button></div>`;bind()}}));document.querySelector('[data-decision="understood"]')?.addEventListener('click',()=>{slide=0;ai=false;paused=false;deadline=Date.now()+8000;render()});document.querySelector('[data-decision="not-understood"]')?.addEventListener('click',()=>{ai=true;paused=false;render()})}setInterval(()=>{if(slide===0&&!ai&&!paused){if(Date.now()>=deadline){ai=true;render()}}},250);document.querySelector('#reset').addEventListener('click',()=>{slide=-1;ai=false;paused=false;deadline=Date.now()+8000;render()});slide=-1;paused=false;render();
</script></body></html>
